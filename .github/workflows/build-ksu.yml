name: Build KernelSU LKM (5.4)

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next branch'
        required: true
        default: 'legacy'
  push:
    paths:
      - 'Module.symvers'
      - 'kernel_config'
      - 'kheaders.tar.xz'
      - '.github/workflows/build-ksu.yml'
      - 'scripts/patch_ksu.py'

jobs:
  build-lkm:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-11 lld-11 llvm-11 gcc-aarch64-linux-gnu \
            make bc bison flex libssl-dev libelf-dev xz-utils
          # Symlink LLVM 11 tools to standard names
          sudo ln -sf /usr/bin/clang-11 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-11 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-11 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-11 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-11 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-11 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-11 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-11 /usr/local/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-size-11 /usr/local/bin/llvm-size
          sudo ln -sf /usr/bin/llvm-strip-11 /usr/local/bin/llvm-strip

      - name: Clone Sony Xperia SM8350 Android 13 kernel tree
        run: |
          git clone --depth=1 -b master_qcom_a13 https://github.com/Skyler1n/android_kernel_sony_sm8350.git kernel_tree

      - name: Clone KernelSU-Next
        run: |
          KSU_BRANCH="${{ github.event.inputs.ksu_branch || 'legacy' }}"
          git clone --depth=1 -b "$KSU_BRANCH" https://github.com/KernelSU-Next/KernelSU-Next.git ksu
          # Fix Linux 5.4 undefined preempt_enable_no_resched_notrace across all files
          grep -rl "preempt_enable_no_resched_notrace" ksu/kernel/ | xargs sed -i 's/preempt_enable_no_resched_notrace/preempt_enable_notrace/g'
          # Disable path_umount injection so it uses standard ksys_umount
          sed -i 's/KSU_HAS_PATH_UMOUNT/KSU_DISABLE_PATH_UMOUNT/g' ksu/kernel/Kbuild
          sed -i 's/#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)/#if 0 \&\& LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)/g' ksu/kernel/feature/kernel_umount.c
          # Prevent forcing SELinux enforcing mode on permissive OEM systems (avoids userland reboot)
          sed -i 's/setenforce(true);/\/* setenforce(true); *\//g' ksu/kernel/core/init.c
          # Prevent kobject_del on THIS_MODULE to preserve sysfs stability
          sed -i 's/kobject_del(&THIS_MODULE->mkobj.kobj);/\/* kobject_del(&THIS_MODULE->mkobj.kobj); *\//g' ksu/kernel/core/init.c
          # Disable ksu_setup_stack_chk_guard (stock kernel exports and protects __stack_chk_guard in read-only memory)
          sed -i 's/#if defined(CONFIG_STACKPROTECTOR) &&/#if 0 \&\& defined(CONFIG_STACKPROTECTOR) \&\&/g' ksu/kernel/core/init.c
          # Bypass unsafe task_struct list iteration in out-of-tree module (avoids task struct offset mismatch crash)
          python3 scripts/patch_ksu.py ksu
          # Provide internal _find_next_bit implementation to eliminate CFI type signature mismatch
          cat << 'EOF' >> ksu/kernel/compat/kernel_compat.c
          #ifndef BITMAP_FIRST_WORD_MASK
          #define BITMAP_FIRST_WORD_MASK(start) (~0UL << ((start) & (BITS_PER_LONG - 1)))
          #endif
          unsigned long _find_next_bit(const unsigned long *addr1,
          		const unsigned long *addr2, unsigned long nbits,
          		unsigned long start, unsigned long invert, unsigned long le)
          {
          	unsigned long tmp, mask;
          	if (start >= nbits)
          		return nbits;
          	tmp = addr1[start / BITS_PER_LONG];
          	if (addr2)
          		tmp &= addr2[start / BITS_PER_LONG];
          	tmp ^= invert;
          	mask = BITMAP_FIRST_WORD_MASK(start);
          	if (le)
          		mask = swab(mask);
          	tmp &= mask;
          	start = round_down(start, BITS_PER_LONG);
          	while (!tmp) {
          		start += BITS_PER_LONG;
          		if (start >= nbits)
          			return nbits;
          		tmp = addr1[start / BITS_PER_LONG];
          		if (addr2)
          			tmp &= addr2[start / BITS_PER_LONG];
          		tmp ^= invert;
          	}
          	if (le)
          		tmp = swab(tmp);
          	return min(start + __ffs(tmp), nbits);
          }
          __attribute__((no_sanitize("cfi")))
          void __cfi_slowpath_diag(unsigned long long id, void *ptr, void *diag)
          {
          }
          __attribute__((no_sanitize("cfi")))
          void __ubsan_handle_cfi_check_fail(void *data, void *ptr, void *vtable)
          {
          }
          EOF
          # Force large memory model and recover from CFI checks to prevent traps
          echo "ccflags-y += -fno-pic -mcmodel=large -fno-sanitize-trap=cfi -fsanitize-recover=cfi" >> ksu/kernel/Kbuild
          echo "subdir-ccflags-y += -fno-pic -mcmodel=large -fno-sanitize-trap=cfi -fsanitize-recover=cfi" >> ksu/kernel/Kbuild

      - name: Configure kernel tree matching device
        run: |
          set -o pipefail
          {
            cd kernel_tree
            # Set exact sublevel 210 in Makefile
            sed -i 's/SUBLEVEL = .*/SUBLEVEL = 210/' Makefile

            # Copy our exact extracted kernel config and Module.symvers
            cp ../kernel_config .config
            echo "CONFIG_KSU=m" >> .config
            echo "CONFIG_KSU_DEBUG=y" >> .config
            sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-qgki-g55a0c74ba38a"/' .config
            sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config

            cp ../Module.symvers Module.symvers

            # Generate configuration headers non-interactively
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig

            # Prepare include files
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)

            # Overlay exact live device kernel headers from /sys/kernel/kheaders.tar.xz (fixes struct offsets)
            tar -xf ../kheaders.tar.xz -C .

            # Generate SELinux header files (flask.h & av_permissions.h) required by KernelSU
            make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 security/selinux/flask.h || {
              clang -Iinclude/uapi -Iinclude -Isecurity/selinux/include scripts/selinux/genheaders/genheaders.c -o scripts/selinux/genheaders/genheaders
              scripts/selinux/genheaders/genheaders security/selinux/flask.h security/selinux/av_permissions.h
            }
            cp -f security/selinux/flask.h security/selinux/include/flask.h || true
            cp -f security/selinux/av_permissions.h security/selinux/include/av_permissions.h || true

            # Force exact vermagic string matching the live Sony Xperia 5 III kernel
            echo '#define UTS_RELEASE "5.4.210-qgki-g55a0c74ba38a"' > include/generated/utsrelease.h
          } 2>&1 | tee /tmp/build.log

      - name: Compile kernelsu.ko module
        run: |
          set -o pipefail
          cd kernel_tree
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            CONFIG_KSU=m CONFIG_KSU_KPROBES_HOOK=y CONFIG_KSU_DEBUG=y KBUILD_MODPOST_WARN=1 \
            KCFLAGS="-fno-pic -mcmodel=large -fno-sanitize-trap=cfi -fsanitize-recover=cfi" \
            M=$GITHUB_WORKSPACE/ksu/kernel modules -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: Inspect and strip module
        run: |
          KO_PATH=$(find "$GITHUB_WORKSPACE/ksu" "$GITHUB_WORKSPACE/kernel_tree" -name "kernelsu.ko" -print -quit)
          echo "[+] Located module: $KO_PATH"
          if [ -n "$KO_PATH" ] && [ -f "$KO_PATH" ]; then
            echo "[+] Resolving unexported symbols using live device kallsyms..."
            python3 scripts/resolve_symbols.py "$KO_PATH" kallsyms.gz Module.symvers
            echo "[+] Stripping debug symbols..."
            llvm-strip --strip-debug "$KO_PATH"
            strings "$KO_PATH" | grep -E "vermagic=" || true
            mkdir -p out
            cp "$KO_PATH" out/
          else
            echo "[-] Error: kernelsu.ko not found!"
            find . -name "*.ko" || true
            exit 1
          fi

      - name: Commit kernelsu.ko to binaries branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B binaries
          git add -f out/kernelsu.ko
          git commit -m "chore(release): build kernelsu.ko for SOG05 5.4.210" || true
          git push -f origin binaries

      - name: Upload log on failure
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          touch /tmp/build.log
          cp -f /tmp/build.log ./build.log
          git add -f build.log
          git commit -m "chore(ci): capture build failure log" || true
          git push -f origin build-log || true

      - name: Upload kernelsu.ko artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-sog05-5.4.210
          path: out/kernelsu.ko

