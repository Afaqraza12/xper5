name: Build Sagami 5.4 Kexec Kernel & LKM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-kexec-kernel.yml'
      - 'tools/j4nn-kexec-mod/**'

jobs:
  build-kexec:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-11 lld-11 llvm-11 gcc-aarch64-linux-gnu libc6-dev-arm64-cross \
            make bc bison flex libssl-dev libelf-dev xz-utils device-tree-compiler
          # Symlink LLVM 11 tools to standard names
          sudo ln -sf /usr/bin/clang-11 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-11 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/lld-11 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-11 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-objcopy-11 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-objdump-11 /usr/local/bin/llvm-objdump
          sudo ln -sf /usr/bin/llvm-readelf-11 /usr/local/bin/llvm-readelf
          sudo ln -sf /usr/bin/llvm-size-11 /usr/local/bin/llvm-size
          sudo ln -sf /usr/bin/llvm-strip-11 /usr/local/bin/llvm-strip

          # Wrapper for llvm-nm to handle SIGPIPE (broken pipe) gracefully
          printf '#!/bin/bash\n/usr/bin/llvm-nm-11 "$@"\nret=$?\nif [ $ret -eq 141 ] || [ $ret -eq 134 ]; then\n  exit 0\nfi\nexit $ret\n' | sudo tee /usr/local/bin/llvm-nm > /dev/null
          sudo chmod +x /usr/local/bin/llvm-nm

      - name: Clone Sony Xperia SM8350 Android 13 kernel tree
        run: |
          git clone --depth=1 -b master_qcom_a13 https://github.com/Skyler1n/android_kernel_sony_sm8350.git kernel_tree

      - name: Configure kernel tree with CONFIG_KEXEC
        run: |
          cd kernel_tree
          # Set exact sublevel 210 in Makefile
          sed -i 's/SUBLEVEL = .*/SUBLEVEL = 210/' Makefile

          # Copy our extracted kernel config
          cp ../kernel_config .config

          # Enable KEXEC in defconfig (standard kexec)
          sed -i 's/# CONFIG_KEXEC is not set/CONFIG_KEXEC=y/' .config
          grep -q "CONFIG_KEXEC=y" .config || echo "CONFIG_KEXEC=y" >> .config
          # Ensure experimental KEXEC_FILE is disabled (avoids missing kexec_image_ops in arm64 5.4)
          sed -i 's/CONFIG_KEXEC_FILE=y/# CONFIG_KEXEC_FILE is not set/' .config

          # Disable UAPI header tests & headers install to prevent bcache.h hdrtest failure
          sed -i 's/CONFIG_UAPI_HEADER_TEST=y/# CONFIG_UAPI_HEADER_TEST is not set/' .config
          sed -i 's/CONFIG_HEADERS_INSTALL=y/# CONFIG_HEADERS_INSTALL is not set/' .config

          # Neutralize Qualcomm gcc-wrapper.py so harmless warnings do not abort the build
          printf '#!/usr/bin/env python3\nimport sys, os\nos.execvp(sys.argv[1], sys.argv[1:])\n' > scripts/gcc-wrapper.py
          chmod +x scripts/gcc-wrapper.py

          # Fix arm64 spinlock header types under CONFIG_PARAVIRT
          sed -i 's|#include <asm-generic/qspinlock_types.h>|#include <linux/types.h>\n#include <asm-generic/qspinlock_types.h>|' arch/arm64/include/asm/spinlock_types.h
          python3 -c 'p="include/asm-generic/qspinlock_types.h"; c=open(p).read(); open(p,"w").write(c.replace("#ifndef CONFIG_PARAVIRT\n#include <linux/types.h>", "#include <linux/types.h>\n#ifndef CONFIG_PARAVIRT"))'

          # Fix walt trace include path for Clang
          sed -i 's|#define TRACE_INCLUDE_PATH \.|#define TRACE_INCLUDE_PATH ../../kernel/sched/walt|' kernel/sched/walt/trace.h
          grep -q "CFLAGS_trace.o" kernel/sched/walt/Makefile || echo "CFLAGS_trace.o := -I\$(src)" >> kernel/sched/walt/Makefile

          # Fix techpack broken symlinks pointing to external kernel/msm-5.4
          mkdir -p kernel && ln -sf .. kernel/msm-5.4
          python3 -c '
          import os
          kroot = os.path.abspath(".")
          for root, dirs, files in os.walk("techpack"):
              for f in files:
                  fp = os.path.join(root, f)
                  if os.path.islink(fp):
                      t = os.readlink(fp)
                      if "kernel/msm-5.4/" in t:
                          sub = t.split("kernel/msm-5.4/")[1]
                          rt = os.path.join(kroot, sub)
                          if os.path.exists(rt):
                              os.unlink(fp)
                              os.symlink(os.path.relpath(rt, root), fp)
          '

          # Fix in-tree local directory includes for trace headers (e.g. hid-trace.h, walt/trace.h)
          python3 -c '
          p = "scripts/Makefile.lib"
          c = open(p).read()
          old = "ifdef building_out_of_srctree\n_c_flags   += -I $(srctree)/$(src) -I $(objtree)/$(obj)\n_a_flags   += -I $(srctree)/$(src) -I $(objtree)/$(obj)\n_cpp_flags += -I $(srctree)/$(src) -I $(objtree)/$(obj)\nendif"
          new = "_c_flags   += -I $(srctree)/$(src) -I $(objtree)/$(obj)\n_a_flags   += -I $(srctree)/$(src) -I $(objtree)/$(obj)\n_cpp_flags += -I $(srctree)/$(src) -I $(objtree)/$(obj)"
          open(p, "w").write(c.replace(old, new))
          '
          # Explicitly add CFLAGS for hid-trace
          grep -q "CFLAGS_hid-trace.o" drivers/hid/Makefile || echo "CFLAGS_hid-trace.o := -I\$(src)" >> drivers/hid/Makefile

          # Keep exact stock version branding
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-qgki-g55a0c74ba38a"/' .config
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/# CONFIG_LOCALVERSION_AUTO is not set/' .config

          cp ../Module.symvers Module.symvers

          # Generate configuration headers non-interactively
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 olddefconfig

          # Force exact vermagic string matching the live Sony Xperia 5 III kernel
          echo '#define UTS_RELEASE "5.4.210-qgki-g55a0c74ba38a"' > include/generated/utsrelease.h

      - name: Compile target kernel Image and DTBs
        run: |
          cd kernel_tree
          # Compile full kernel Image and DTBs with warning-as-error disabled to allow clean build
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error -Wno-declaration-after-statement" \
            -j$(nproc) Image
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-Wno-error -Wno-declaration-after-statement" \
            -j$(nproc) dtbs || true

      - name: Compile kexec-mod LKM module
        run: |
          cd kernel_tree
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-fno-pic -mcmodel=large -fno-sanitize-trap=cfi -fsanitize-recover=cfi -Wno-error" \
            M=$GITHUB_WORKSPACE/tools/j4nn-kexec-mod/kernel modules -j$(nproc) || true

      - name: Compile user-space helper redir.so
        run: |
          cd tools/j4nn-kexec-mod/user
          aarch64-linux-gnu-gcc -O2 -Wall -shared -fpic -o redir.so redir.c

      - name: Stage build artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/kexec_out

          # 1. Target Kernel Image
          if [ -f kernel_tree/arch/arm64/boot/Image ]; then
            cp kernel_tree/arch/arm64/boot/Image $GITHUB_WORKSPACE/kexec_out/Image
            echo "[+] Target Image staged: $(ls -lh $GITHUB_WORKSPACE/kexec_out/Image)"
          fi

          # 2. Target Device Tree Blobs for pdx214
          if [ -f "$GITHUB_WORKSPACE/dts/live_pdx214.dtb" ]; then
            cp "$GITHUB_WORKSPACE/dts/live_pdx214.dtb" $GITHUB_WORKSPACE/kexec_out/live_pdx214.dtb
            echo "[+] Live Xperia 5 III DTB staged: $(ls -lh $GITHUB_WORKSPACE/kexec_out/live_pdx214.dtb)"
          fi
          find kernel_tree/arch/arm64/boot/dts/ -name "*pdx214*.dtb" -exec cp {} $GITHUB_WORKSPACE/kexec_out/ \; || true
          find kernel_tree/arch/arm64/boot/dts/ -name "*sagami*.dtb" -exec cp {} $GITHUB_WORKSPACE/kexec_out/ \; || true

          # 3. Kexec Module
          find "$GITHUB_WORKSPACE/tools/j4nn-kexec-mod/kernel" -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/kexec_out/ \; || true

          # 4. User-space binaries (redir.so and static kexec tool)
          if [ -f "$GITHUB_WORKSPACE/tools/j4nn-kexec-mod/user/redir.so" ]; then
            cp "$GITHUB_WORKSPACE/tools/j4nn-kexec-mod/user/redir.so" $GITHUB_WORKSPACE/kexec_out/
          fi
          if [ -f "$GITHUB_WORKSPACE/tools/j4nn-kexec-mod/user/kexec" ]; then
            cp "$GITHUB_WORKSPACE/tools/j4nn-kexec-mod/user/kexec" $GITHUB_WORKSPACE/kexec_out/
          fi

          # Strip debug symbols on modules
          for m in $GITHUB_WORKSPACE/kexec_out/*.ko; do
            [ -f "$m" ] && llvm-strip --strip-debug "$m"
          done

          ls -la $GITHUB_WORKSPACE/kexec_out/

      - name: Upload Kexec Kernel & LKM Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sagami-5.4-kexec-pdx214
          path: kexec_out/*
