name: Build SOG05 one-click APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apk/**'
      - 'tools/kspatch/**'
      - 'kernelsu.ko'
      - 'sog05-5.4.210/bin/exploit_static'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d

      - name: Install Android SDK command-line tools
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install platform, build-tools
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null
          echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Build kspatch (arm64 static)
        run: |
          set -e
          CC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          ls -l "$CC"
          "$CC" -O2 -static -o kspatch tools/kspatch/kspatch.c
          file kspatch

      - name: Stage native payloads into jniLibs
        run: |
          set -e
          DEST=apk/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$DEST"
          # The exploit binary is loaded/exec'd by the Shizuku service.
          cp sog05-5.4.210/bin/exploit_static "$DEST/libgl.so"
          # The on-device symbol patcher.
          cp kspatch "$DEST/libkspatch.so"
          # The KernelSU module, carried as an asset (not a jniLib).
          mkdir -p apk/app/src/main/assets
          cp kernelsu.ko apk/app/src/main/assets/kernelsu.ko
          chmod +x "$DEST/libgl.so" "$DEST/libkspatch.so"
          ls -la "$DEST" apk/app/src/main/assets

      - name: Verify payloads are arm64
        run: |
          set -e
          for f in apk/app/src/main/jniLibs/arm64-v8a/*.so; do
            echo "== $f"
            file "$f" | grep -q "aarch64" || { echo "not arm64!"; exit 1; }
          done

      - name: Build APK
        working-directory: apk
        run: |
          set -e
          # Use a pinned Gradle directly; no wrapper is checked in.
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle-dist"
          "$HOME/gradle-dist/gradle-8.9/bin/gradle" :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sog05-root-apk
          path: apk/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
